name: Add issues to project board

# Every new issue and pull request lands on the maintainer's project board.
# Requires a repository secret ADD_TO_PROJECT_PAT (classic token with the
# "project" scope, or fine-grained token with Projects read/write).

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/MrWENS69/projects/16
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
