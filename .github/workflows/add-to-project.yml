name: Add issues to project board

# Every new issue and pull request lands on the maintainer's project board.
# Requires a repository secret ADD_TO_PROJECT_PAT: a fine-grained token with
# read/write access to that single project is enough.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133e # v1.0.2
        with:
          project-url: https://github.com/users/MrWENS69/projects/16
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
