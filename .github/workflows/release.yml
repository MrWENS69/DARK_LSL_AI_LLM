name: Release

# Pushing a tag vX.Y.Z builds Linux, macOS (Apple Silicon and Intel) and
# Windows binaries, publishes SHA256SUMS.txt, and attaches everything to a
# GitHub release named after the tag. lslcheck.py downloads these assets.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  WFB_URL: https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip
  WFB_SHA256: 8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tag must look like v1.2.3
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+(\.[0-9]+){1,3}$'

  linux:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y flex bison
      - run: make DEBUG= BUILD_VERSION_NUMBER="${GITHUB_REF_NAME#v}"
      - run: sh test.sh
      - run: |
          mkdir -p dist
          zip -j "dist/lslint_${GITHUB_REF_NAME}_linux64.zip" lslint builtins_version.txt lslcheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-linux64
          path: dist/*.zip

  macos:
    needs: check-tag
    strategy:
      matrix:
        include:
          - runner: macos-latest
            suffix: macos-arm64
          - runner: macos-15-intel
            suffix: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: brew install flex bison
      - run: |
          export PATH="/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin:$PATH"
          make DEBUG= BUILD_VERSION_NUMBER="${GITHUB_REF_NAME#v}"
      - run: sh test.sh
      - run: |
          mkdir -p dist
          zip -j "dist/lslint_${GITHUB_REF_NAME}_${{ matrix.suffix }}.zip" lslint builtins_version.txt lslcheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.suffix }}
          path: dist/*.zip

  windows:
    needs: check-tag
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install winflexbison (checksum verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WFB_URL -OutFile wfb.zip
          $hash = (Get-FileHash wfb.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WFB_SHA256) { throw "winflexbison checksum mismatch: $hash" }
          Expand-Archive wfb.zip -DestinationPath C:\flexandbison
      - shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          cmd /c "build_win64.cmd $version"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - shell: bash
        run: sh test.sh
      - shell: bash
        run: |
          mkdir -p dist
          7z a "dist/lslint_${GITHUB_REF_NAME}_win64.zip" lslint.exe builtins_version.txt lslcheck.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-win64
          path: dist/*.zip

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (lslcheck.py refuses a binary that does not match)
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
